# Agent team config. Copy to your project root as team.toml (scripts/setup-agent-team.sh does this).
# Paths are relative to this file. See docs/AGENT_TEAM.md.

[project]
name = "myproject"            # session/notification/chat names
root = "."                    # workspace root (agents run here)
state_dir = ".agent-team"     # tasks, live.log, locks, queue; keep out of version control
docs = ["AGENTS.md", "SPEC.md", "ROADMAP.md", "TASKS.md", "docs/"]  # what the Producer is told to read
queue_file = "queue.txt"      # optional, relative to state_dir: lines "tNNN: title [(after tNNN)]", queue order
planning_file = "TASKS.md"    # focus_tui reads its "## Current phase"
templates_dir = ""            # optional dir (relative to root) with jobs/, agents/, roles/, vcs/ overrides
team_setup = ""               # date the team-setup skill finished; empty: the coordinator offers it first

[vcs]
kind = "p4"                   # git, p4, none, or any X with a vcs_X.py adapter; setup rewrites this block for git or none
guard_names = ["p4", "git"]   # tools shadowed on the agents' PATH by bin/vcs-guard
[vcs.deny]                    # subcommands agents may not run per tool, also via aliases; "*" denies the tool entirely
p4 = ["submit", "revert", "shelve", "unshelve", "obliterate", "sync", "clean", "flush", "integrate", "integ",
      "copy", "merge", "populate"]
git = ["*"]
[vcs.deny_flags]              # tool -> subcommand -> refused flags (also inside combined short flags like -df)
p4 = { change = ["-d", "-f"], changelist = ["-d", "-f"] }

[agents]
deny_extra = ["chmod"]        # more Claude Bash(...) deny rules (git commands come from [vcs.deny])
mcp = "write"                 # Claude runs: user MCP servers load in "all" stages, only "write" (implement) stages, or "none"; each
                              # server's tools are re-sent every turn (read-only stage: ~82k tokens with them, ~6k without)
user_skills = false           # true: also load the user's own Claude skills/slash commands (--disable-slash-commands otherwise)
codex_sandbox = "danger-full-access"  # Codex writers: no sandbox, approvals by Codex auto-review; "workspace-write":
                              # sandboxed to the workspace (.git read-only); "user": your ~/.codex/config.toml
resume = true                 # retries and re-reviews continue their CLI session and get only what changed

[locks]                       # shared resources an agent leases only while using one (`team lock`/`team unlock`)
names = ["editor", "gpu", "build"]  # editor = the project editor; gpu = GPU-heavy captures or renders; build = cooks/packaging
default = ["editor"]          # kept for old configs: tasks no longer hold locks for their whole run
[locks.gpu]                   # `team lock gpu` refuses while the probe reports too little (skipped without nvidia-smi)
min_free_mib = 9000
probe_cmd = ["nvidia-smi", "--query-gpu=memory.free", "--format=csv,noheader,nounits"]
skip_if_holds = "editor"      # no check while the task holds this lock too

[queue]                       # refill: when the queue runs low the Producer proposes the next tasks from the plan
refill = true                 # proposals become pNNN lines in queue_file; nothing runs until `team promote`
low_water = 1                 # refill when queued tasks + planned lines drop below this and a slot is free
batch = 3                     # proposals per refill
daily_cap = 10                # proposals per day
pause_needs_you = 2           # no refill while this many tasks wait for the user
cooldown_min = 30             # minutes between refills

[probes]                      # name = url, shown to agents as "name up/down"
# service = "http://127.0.0.1:9000/health"

[prompts]
readonly_note = "Read-only stage: use tools only to inspect, never to change."

[notify]
# review_cadence = "task"     # when done tasks open a review page: task (each), milestone (all tasks of planning_file's
#                             # "## Current phase" checked off), daily (first done task each day), custom (never
#                             # automatic: the coordinator follows review_cadence_rule). Gates, blocked, escalated and
#                             # failed tasks always open at once. Unset: the coordinator asks.
# review_cadence_rule = ""    # custom only, free text, e.g. "every 3 done tasks"
app_name = ""                 # default: project name
sound_dir = ""                # e.g. /usr/share/sounds/freedesktop/stereo; empty = no sound
sound_normal = "message.oga"
sound_urgent = "alarm-clock-elapsed.oga"

[usage]
claude_endpoint = false       # true: usage_tui may call Claude's usage endpoint with Claude Code's OAuth token
extra_module = ""             # optional project .py (root-relative) adding usage_tui rows: rows(cfg, compact), json(cfg, timeout)

# Canonical roles producer, mid, senior, architect, director are required; add more freely. The model/effort ladder
# (low, mid, high, top, apex) and how to retune it: docs/MODEL_LADDER.md. apex is reached by escalation only.
# --- roles: scripts/setup-agent-team.sh replaces this block with the claude, codex or both preset ---
[roles.producer]
name = "Producer"
cli = "claude"
model = "claude-sonnet-5-5"
effort = "low"
[roles.mid]
name = "Mid Dev"
cli = "claude"
model = "claude-sonnet-5-5"
effort = "medium"
[roles.senior]
name = "Senior Dev"
cli = "claude"
model = "claude-opus-5-5"
effort = "high"
[roles.architect]
name = "Architect"
cli = "claude"
model = "claude-opus-5-5"
effort = "high"
[roles.director]
name = "Tech Director"
cli = "claude"
model = "claude-opus-5-5"
effort = "xhigh"
[roles.mid_high]
name = "Mid Dev (high)"
cli = "claude"
model = "claude-sonnet-5-5"
effort = "high"
[roles.apex]
name = "Apex"
cli = "claude"
model = "claude-fable-5-1"
effort = "high"
# --- end roles ---

[routing]
max_rounds = 2                # minor failed review rounds per target (plan, implement) before escalating to the user
max_parallel = 3              # concurrent team runs
long_stage_min = 120          # team wait and the alerts pane flag a stage running longer (0 = never)
domains = ["gameplay", "engine", "tools", "technical_art", "audio", "design", "build"]  # ROUTE domains the Producer may pick
review_extra_domains = ["technical_art", "audio"]  # domains that get one more review ...
extra_review_routes = ["hard"]  # ... and routes that do
extra_review_role = "director"
side_task_reviewer = "architect"  # `team new --role X` skips routing; this role reviews
side_task_roles = ["mid", "senior", "gameplay", "engine", "tools", "technical_artist", "audio", "designer", "qa", "build_release", "narrative", "vfx", "ui"]
capacity_fallback = {}        # role -> role to retry on when a model reports 503/at capacity
# Per-domain stage agents: plan, plan_review, implement, review name agents (templates/agents files or [roles] keys).
# Agents are discipline identity (prompt, scope); the model/effort of each stage comes from the route's role profile and
# [heuristic], not from the agent. plan_review != plan, review != implement; none reviews with director (hard routes add it).
# [routing.domain_roles] is deprecated: domain = agent is plan + implement.
[routing.domain.gameplay]
plan = "gameplay"
plan_review = "engine"
implement = "gameplay"
review = "qa"
[routing.domain.engine]
plan = "engine"
plan_review = "architect"
implement = "engine"
review = "architect"
[routing.domain.tools]
plan = "tools"
plan_review = "architect"
implement = "tools"
review = "engine"
[routing.domain.technical_art]
plan = "technical_artist"
plan_review = "engine"
implement = "technical_artist"
review = "qa"
[routing.domain.audio]
plan = "audio"
plan_review = "engine"
implement = "audio"
review = "qa"
[routing.domain.design]
plan = "designer"
plan_review = "gameplay"
implement = "designer"
review = "qa"
[routing.domain.build]
plan = "build_release"
plan_review = "engine"
implement = "build_release"
review = "tools"
# Skip defaults: [routing.skip] route = [stages] and `skip = [stages]` in a [routing.domain.<name>] table drop plan and/or
# plan_review (plan implies plan_review) from non-hard routes. review cannot be skipped; hard never skips.
# [routing.skip]
# complex = ["plan_review"]
[routing.side_task_domains]   # side-task role -> domain (default: first domain)
technical_artist = "technical_art"
audio = "audio"
designer = "design"
engine = "engine"
tools = "tools"
build_release = "build"
qa = "gameplay"
narrative = "design"     # narrative, vfx and ui are side-task agents; no domain stage table uses them
vfx = "technical_art"
ui = "gameplay"
# Adaptive pipeline: the Producer picks the lightest route that keeps the quality bar (jobs/route.md has the criteria).
# direct (alias simple): implement, review. bundled: one agent plans then implements in one run (plan = first section
# of its report), review. planned: plan, implement, review (no plan_review). complex/hard: the full cycle. bundled and
# planned are derived from direct and complex unless defined below. The review gate is never skipped. A failed review on
# a route without its plan retries one route up (direct/bundled -> planned -> complex) at the plan stage and counts as a
# failure for [heuristic] failures_min. `team new --route X` overrides the pick; high risk or earlier failures raise
# a lighter route to complex. `team status --metrics` reports tokens, wall time, first-pass rate, rounds, upgrades.
[routing.pipeline]            # [stage kind, role] lists; plan_implement = plan + implement in one run
direct = [["implement", "mid"], ["review", "architect"]]
bundled = [["plan_implement", "mid"], ["review", "architect"]]
planned = [["plan", "architect"], ["implement", "mid"], ["review", "architect"]]
complex = [["plan", "architect"], ["plan_review", "director"], ["implement", "mid"], ["review", "architect"]]
hard = [["plan", "director"], ["plan_review", "architect"], ["implement", "senior"], ["review", "architect"]]
# Escalation: a reviewer's SEVERITY major/critical (or ESCALATE: yes) retries the same agent one tier up the
# [heuristic.tiers] ladder; at the strongest tier, or with no ladder, a pin or a role_override, it goes to the user.
# [routing.takeover.<role>] (after_reviews, after_attempt; `to` optional) steps the same agent up once; with `to`
# a different (non-reviewing) agent takes over instead. [routing.after_impl_fails] steps up once at `fails` failures.
# [routing.takeover.mid]
# after_reviews = 1
[routing.after_impl_fails]
# fails = 3
# Model/effort heuristic. Tiers are ranks, weakest first; each names a [roles] profile per cli. Rules run top
# to bottom and set a minimum (tier and/or effort); the highest wins; the stage's own profile is a floor (at its rank it
# runs unchanged), so a ladder without rules only acts on escalation. when keys: route
# (direct|bundled|planned|complex|hard|custom; simple = direct), domain, risk (low|medium|high), size (small|medium|large), stage (route|plan|
# plan_review|implement|plan_implement|review; a plan_implement run matches plan and implement rules), failures_min (rejected plans + implementations), usage (low|claude|codex|mixed; only
# with fresh [routing.usage] data). A value may be a list. Agent frontmatter model/effort is a floor; `pin = true`
# makes it exact. Each launch logs the rule in live.log and in state.json (launches[].heuristic).
# Example rule: when = { risk = "high", size = ["medium", "large"] }, min = { tier = "high", effort = "high" }
# --- ladder: the tier ladder escalation steps up (scripts/setup-agent-team writes it per agent preset; without it a major review failure goes to the user) ---
[heuristic.tiers]
low  = { claude = "mid" }
mid  = { claude = "mid_high" }
high = { claude = "senior" }
top  = { claude = "director" }
apex = { claude = "apex" }
# --- end ladder ---
[[heuristic.rule]]
name = "hard-route"
when = { route = "hard" }
min  = { tier = "high", effort = "high" }
[[heuristic.rule]]
name = "high-risk"
when = { risk = "high", size = ["medium", "large"], route = ["complex", "hard"] }
min  = { tier = "high" }
[[heuristic.rule]]
name = "bundled-implementer"   # a bundled run plans and builds: at least the implementer tier when it is not trivial
when = { route = "bundled", risk = ["medium", "high"] }
min  = { tier = "mid" }
[[heuristic.rule]]
name = "repeat-failures"
when = { failures_min = 2 }
min  = { tier = "high" }
[routing.usage]               # Claude/Codex plan balancing; needs both CLIs and usage_tui data
enabled = false
limits = { "5h" = 90.0, "7d" = 95.0 }   # percent used at which Claude roles fall back to Codex
