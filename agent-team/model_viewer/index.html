<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model viewer</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#14110f;color:#e8e0d8;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
#ui{position:fixed;top:10px;left:10px;width:260px;max-height:calc(100% - 20px);overflow:auto;background:#1f1a17ee;border:1px solid #3a302a;border-radius:10px;padding:10px}
#ui h1{font-size:15px;margin:0 0 6px;color:#ff7a45}
#ui label{display:block;margin:3px 0;cursor:pointer}
#ui select,#ui button{width:100%;margin:3px 0;background:#2a221d;color:#e8e0d8;border:1px solid #3a302a;border-radius:6px;padding:5px}
#ui .row{display:flex;gap:6px}#ui .row>*{flex:1}
#info{white-space:pre;color:#a89c90;font-size:12px;margin-top:6px}
#meshes{margin-top:4px;border-top:1px solid #3a302a;padding-top:4px}
small{color:#a89c90}
#err{color:#ff8a70}
</style>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Model viewer</h1>
  <select id="file"></select>
  <label><input type="radio" name="mode" value="solid" checked> Solid</label>
  <label><input type="radio" name="mode" value="wire"> Wireframe</label>
  <label><input type="radio" name="mode" value="both"> Solid + wire overlay</label>
  <label><input type="radio" name="mode" value="normal"> Normals (check shading)</label>
  <label><input type="checkbox" id="skel"> Skeleton</label>
  <label><input type="checkbox" id="grid" checked> Grid and floor</label>
  <label><input type="checkbox" id="spin"> Turntable</label>
  <label><input type="checkbox" id="flat"> Flat shading</label>
  <div class="row"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="top">Top</button></div>
  <div class="row"><button id="frame">Frame</button><button id="light">Light: <span id="lm">studio</span></button></div>
  <div id="meshes"></div>
  <div id="info"></div><div id="err"></div>
  <small>Drag to orbit, wheel to zoom, right-drag to pan. Drop an FBX or GLB file on the page to load it.</small>
</div>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './lib/jsm/controls/OrbitControls.js';
import {FBXLoader} from './lib/jsm/loaders/FBXLoader.js';
import {GLTFLoader} from './lib/jsm/loaders/GLTFLoader.js';

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2b2724);
const camera=new THREE.PerspectiveCamera(35,1,0.01,1000); camera.position.set(0,1,3);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true;
const grid=new THREE.GridHelper(4,40,0x6b5b4d,0x3a302a);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2,48).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x3a332e,roughness:1}));
floor.position.y=-0.001; scene.add(grid,floor);
const hemi=new THREE.HemisphereLight(0xffffff,0x554433,1.1), key=new THREE.DirectionalLight(0xffffff,2.2), rim=new THREE.DirectionalLight(0xffd9a0,1.2);
key.position.set(2,4,3); rim.position.set(-3,2,-3); scene.add(hemi,key,rim);
const lights=[['studio',[1.1,2.2,1.2]],['flat',[2.2,0,0]],['dramatic',[0.3,3.2,2.0]]]; let li=0;

let root=null, skelHelper=null, meshes=[], origMats=new Map(), wireMats=new Map();
const $=id=>document.getElementById(id), err=$('err'), info=$('info');
const wireMat=()=>new THREE.MeshBasicMaterial({color:0xffb070,wireframe:true,transparent:true,opacity:.85});
const normalMat=()=>new THREE.MeshNormalMaterial();

function clearModel(){ if(root){scene.remove(root);} if(skelHelper){scene.remove(skelHelper);} root=null;skelHelper=null;meshes=[];origMats.clear();$('meshes').innerHTML=''; }
function frame(){ if(!root)return; const b=new THREE.Box3().setFromObject(root); const s=b.getSize(new THREE.Vector3()), c=b.getCenter(new THREE.Vector3());
  const r=Math.max(s.x,s.y,s.z)||1; camera.near=r/500; camera.far=r*50; camera.updateProjectionMatrix();
  controls.target.copy(c); camera.position.set(c.x,c.y+r*.1,c.z+r*2.3); controls.update(); grid.scale.setScalar(r/2);floor.scale.setScalar(r/2);grid.position.y=floor.position.y=b.min.y-r*0.001; }
function setView(v){ if(!root)return; const b=new THREE.Box3().setFromObject(root), c=b.getCenter(new THREE.Vector3()), r=Math.max(...b.getSize(new THREE.Vector3()).toArray())*2.3;
  const p={front:[0,0,1],side:[1,0,0],top:[0,1,.001]}[v]; camera.position.set(c.x+p[0]*r,c.y+p[1]*r,c.z+p[2]*r); controls.target.copy(c); controls.update(); }
function stats(){ let tri=0,vtx=0,bones=0; meshes.forEach(m=>{const g=m.geometry; vtx+=g.attributes.position.count; tri+=(g.index?g.index.count:g.attributes.position.count)/3; if(m.skeleton)bones=Math.max(bones,m.skeleton.bones.length);});
  info.textContent=`meshes ${meshes.length}\ntriangles ${Math.round(tri).toLocaleString()}\nvertices ${vtx.toLocaleString()}\nbones ${bones||'-'}`; }
function applyMode(){ const mode=document.querySelector('input[name=mode]:checked').value;
  meshes.forEach(m=>{ m.children.filter(c=>c.userData.overlay).forEach(c=>m.remove(c));
    const o=origMats.get(m);
    if(mode==='solid'){m.material=o}
    else if(mode==='wire'){m.material=Array.isArray(o)?o.map(wireMat):wireMat()}
    else if(mode==='normal'){m.material=Array.isArray(o)?o.map(normalMat):normalMat()}
    else { m.material=o; const w=m.isSkinnedMesh?new THREE.SkinnedMesh(m.geometry,wireMat()):new THREE.Mesh(m.geometry,wireMat()); if(m.isSkinnedMesh){w.skeleton=m.skeleton;w.bindMatrix.copy(m.bindMatrix);w.bindMatrixInverse.copy(m.bindMatrixInverse)}
      w.material.polygonOffset=true; w.material.polygonOffsetFactor=-1; w.userData.overlay=true; w.frustumCulled=false; m.add(w);}
    (Array.isArray(m.material)?m.material:[m.material]).forEach(mt=>{ if(mt&&'flatShading' in mt){mt.flatShading=$('flat').checked;mt.needsUpdate=true;} });
  }); }
function addRoot(obj){ clearModel(); root=obj; scene.add(root);
  root.traverse(o=>{ if(o.isMesh||o.isSkinnedMesh){ meshes.push(o); o.frustumCulled=false; origMats.set(o,o.material);
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m){m.side=THREE.DoubleSide;} }); } });
  // FBX from Blender may be in centimetres: normalise to ~1.8 units tall
  const b=new THREE.Box3().setFromObject(root), h=b.getSize(new THREE.Vector3()).y; if(h>10||h<0.2){const s=1.7/(h||1); root.scale.multiplyScalar(s)}
  root.updateMatrixWorld(true);
  const sk=meshes.find(m=>m.isSkinnedMesh); if(sk){ skelHelper=new THREE.SkeletonHelper(root); skelHelper.visible=$('skel').checked; scene.add(skelHelper);}
  const box=new THREE.Box3().setFromObject(root); root.position.y-=box.min.y; root.updateMatrixWorld(true);
  const ml=$('meshes'); meshes.forEach((m,i)=>{ const l=document.createElement('label'); l.innerHTML=`<input type=checkbox checked data-i=${i}> ${m.name||'mesh '+i} <small>${Math.round((m.geometry.index?m.geometry.index.count:m.geometry.attributes.position.count)/3).toLocaleString()} tris</small>`; ml.appendChild(l); });
  ml.querySelectorAll('input').forEach(i=>i.onchange=()=>{meshes[+i.dataset.i].visible=i.checked});
  stats(); applyMode(); frame(); }
async function load(url,name){ err.textContent=''; info.textContent='loading '+name+' ...';
  try{ const ext=name.split('.').pop().toLowerCase(); const loader=ext==='fbx'?new FBXLoader():new GLTFLoader();
    const res=await new Promise((ok,bad)=>loader.load(url,ok,undefined,bad)); addRoot(res.scene||res); }
  catch(e){ err.textContent='Could not load '+name+': '+e; info.textContent=''; } }

fetch('models/models.json').then(r=>r.json()).then(list=>{ const s=$('file'); list.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)});
  s.onchange=()=>load('models/'+encodeURIComponent(s.value),s.value); if(list.length)s.onchange(); else err.textContent='No models listed (run ./model_viewer <file>).'; }).catch(()=>{err.textContent='models/models.json not found. Start with ./model_viewer <file>.'});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) load(URL.createObjectURL(f),f.name)});
document.querySelectorAll('input[name=mode]').forEach(i=>i.onchange=applyMode);
$('flat').onchange=applyMode; $('skel').onchange=()=>{if(skelHelper)skelHelper.visible=$('skel').checked};
$('grid').onchange=()=>{grid.visible=floor.visible=$('grid').checked};
$('frame').onclick=frame; document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('light').onclick=()=>{li=(li+1)%lights.length;const [n,v]=lights[li];$('lm').textContent=n;hemi.intensity=v[0];key.intensity=v[1];rim.intensity=v[2]};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()} addEventListener('resize',resize);resize();
(function loop(){requestAnimationFrame(loop); if($('spin').checked&&root)root.rotation.y+=0.006; controls.update(); renderer.render(scene,camera)})();
</script>
